<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XP Desktop Mock</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main id="desktop" aria-label="XP desktop"></main>

  <div id="taskbar">
    <button id="start-button" type="button">Start</button>
    <div id="task-buttons"></div>
    <div id="tray">
      <button id="lang-toggle" type="button">TR</button>
      <span id="clock"></span>
    </div>
  </div>

  <ul id="context-menu" class="context-menu" hidden></ul>

  <template id="window-template">
    <section class="window" role="dialog" aria-modal="false">
      <header class="title-bar">
        <span class="title"></span>
        <div class="controls">
          <button class="minimize" type="button">_</button>
          <button class="close" type="button">×</button>
        </div>
      </header>
      <div class="window-content"></div>
      <div class="resize-handle" aria-hidden="true"></div>
    </section>
  </template>

  <script src="script.js"></script>
</body>

</html>
